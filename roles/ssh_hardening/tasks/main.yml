- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
    owner: root
    group: root
    mode: "0644"
  notify: Restart ssh

- name: Validate sshd config
  ansible.builtin.command: sshd -t
  changed_when: false
