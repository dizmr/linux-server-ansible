- name: Create app system user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create app directory
  ansible.builtin.file:
    path: "/opt/{{ app_name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy application code
  ansible.builtin.copy:
    src: main.py
    dest: "/opt/{{ app_name }}/main.py"
    owner: root
    group: root
    mode: "0644"
  notify: Restart app

- name: Install python dependencies in virtualenv
  ansible.builtin.pip:
    name:
      - fastapi
      - uvicorn
    virtualenv: "/opt/{{ app_name }}/venv"
    virtualenv_command: python3 -m venv
  notify: Restart app

- name: Install systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart app

- name: Enable and start app
  ansible.builtin.systemd_service:
    name: "{{ app_name }}"
    enabled: true
    state: started
    daemon_reload: true
